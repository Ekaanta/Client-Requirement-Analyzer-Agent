services:
  - type: web
    name: requirement-validator-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROK_API_KEY
        sync: false
      - key: GROK_MODEL
        value: google/gemma-4-31b-it:free
      - key: FIGMA_ACCESS_TOKEN
        sync: false
      - key: N8N_WEBHOOK_URL
        value: http://invalid:9999/skip
      - key: N8N_API_KEY
        value: ""
      - key: API_DEBUG
        value: "false"
      - key: SECRET_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FILE
        value: logs/app.log